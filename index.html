  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070d; }
  body { font-family:'Zpix', "Courier New", monospace; color:#e2e8f0;
         touch-action:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; display:block; touch-action:none; image-rendering:pixelated; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:18px; background:#05070d; text-align:center; padding:24px; z-index:5; }
  .hidden { display:none !important; }
  .ov.hidden { display:none; }
  #menu { background:radial-gradient(ellipse at 50% 28%, #17325e 0%, #0a1730 46%, #04070f 100%); overflow:hidden; }
  #menu::before {
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.9;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #dbeafe, transparent),
      radial-gradient(1.5px 1.5px at 28% 72%, #bfdbfe, transparent),
      radial-gradient(2px 2px at 44% 26%, #eff6ff, transparent),
      radial-gradient(1.5px 1.5px at 62% 82%, #dbeafe, transparent),
      radial-gradient(1.5px 1.5px at 74% 34%, #bfdbfe, transparent),
      radial-gradient(2px 2px at 86% 64%, #eff6ff, transparent),
      radial-gradient(1.5px 1.5px at 52% 12%, #dbeafe, transparent),
      radial-gradient(1.5px 1.5px at 18% 46%, #bfdbfe, transparent);
  }
  #menu .title { position:relative; font-size:40px; font-weight:bold; color:#f0f7ff; letter-spacing:8px;
    text-shadow:0 0 10px rgba(147,197,253,.95), 0 0 28px rgba(59,130,246,.65), 3px 4px 0 #0a1e3a; }
  #menu .sub { position:relative; color:#7dd3fc; letter-spacing:9px; font-size:12px; margin-top:-10px;
    text-shadow:0 0 8px rgba(56,189,248,.6); }
  @keyframes twinkle { 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
  @keyframes drift { 0%{ transform:translateY(0) } 100%{ transform:translateY(-6px) } }
  #menu::before { animation:twinkle 3.4s ease-in-out infinite; }
  #menu::after {
    content:''; position:absolute; inset:-10px; pointer-events:none; opacity:.75;
    background-image:
      radial-gradient(1px 1px at 8% 55%, #ffffff, transparent),
      radial-gradient(1px 1px at 22% 32%, #dbeafe, transparent),
      radial-gradient(1.5px 1.5px at 38% 78%, #ffffff, transparent),
      radial-gradient(1px 1px at 56% 44%, #bfdbfe, transparent),
      radial-gradient(1px 1px at 68% 88%, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 82% 22%, #dbeafe, transparent),
      radial-gradient(1px 1px at 92% 58%, #ffffff, transparent),
      radial-gradient(1px 1px at 48% 8%, #bfdbfe, transparent);
    animation:twinkle 5.6s ease-in-out infinite reverse, drift 9s ease-in-out infinite alternate;
  }
  #menu .deco { width:190px; height:2px; margin:2px 0 4px;
    background:linear-gradient(90deg, transparent, #60a5fa, #bae6fd, #60a5fa, transparent);
    box-shadow:0 0 10px rgba(96,165,250,.7); }
  #startBtn { font-size:19px; padding:14px 46px; background:linear-gradient(180deg,#7cc0ff,#3b82f6);
    color:#04142c; border:2px solid #0b2545; box-shadow:0 4px 0 #0b2545, 0 0 22px rgba(59,130,246,.5); }
  #startBtn:active { transform:translateY(3px); box-shadow:0 1px 0 #0b2545; }
  #titleLoadBtn { background:linear-gradient(180deg,#2b4a72,#1c3350) !important; color:#dbeafe !important;
    border-color:#0b2545 !important; box-shadow:0 3px 0 #0b2545 !important; }
  #menuNotice { color:#7f9dc0 !important; }
  #subtitle .text { font-size:28px; font-weight:bold; color:#f8fafc; letter-spacing:4px;
                    text-shadow:3px 3px 0 #000; }
  button { font-family:inherit; font-weight:bold; font-size:17px;
           background:#4ade80; color:#052e16; border:2px solid #052e16; border-radius:0;
           box-shadow:0 4px 0 #052e16; padding:13px 34px; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #052e16; }
  #topRight { position:fixed; z-index:7; top:calc(10px + env(safe-area-inset-top, 0px));
              right:calc(12px + env(safe-area-inset-right, 0px));
              display:flex; align-items:center; gap:8px; }
  #miniMap { width:80px; height:80px; image-rendering:pixelated; background:#0a1424;
             border:2px solid #0b2545; box-shadow:0 0 10px rgba(59,130,246,.45); }
  #menuBtn { position:static; z-index:7; top:calc(10px + env(safe-area-inset-top, 0px));
             right:calc(12px + env(safe-area-inset-right, 0px)); width:44px; height:44px; padding:0;
             background:#4b5462; color:#e2e8f0; border:2px solid #0b0f1a; border-radius:0;
             box-shadow:inset 0 1px 0 #5b6472; font-size:18px;
             display:flex; align-items:center; justify-content:center; }
  #menuBtn:active { transform:translateY(2px); }
  #menuWrap { position:fixed; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; }
  #menuWrap.hidden { display:none; }
  .menu-box { position:relative; display:flex; gap:16px; animation:popIn .16s ease-out; }
  .menu-sq { width:78px; height:78px; padding:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:4px; background:linear-gradient(180deg,#2b4a72,#1c3350);
             color:#dbeafe; border:2px solid #0b2545;

<script>
"use strict";
let VW=352, VH=176;
const TILE=16, WCOLS=64, WROWS=44;
const RES=2;   // 内部渲染精度：2 倍，像素视觉大小不变，但镜头可半格移动
const WORLD_W=WCOLS*TILE, WORLD_H=WROWS*TILE;
let JBX=70, JBY=140; const JR=30;   // 常驻摇杆位置（左下，随屏幕）
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width=VW*RES; off.height=VH*RES;
let octx = off.getContext('2d'); octx.imageSmoothingEnabled=false; octx.setTransform(RES,0,0,RES,0,0);
// 静态地面预渲染
const groundCanvas = document.createElement('canvas');
groundCanvas.width = WORLD_W*RES; groundCanvas.height = WORLD_H*RES;
const gctx = groundCanvas.getContext('2d');
gctx.imageSmoothingEnabled = false;
gctx.setTransform(RES,0,0,RES,0,0);
let baking = false;

let cssScale=1, oxCss=0, oyCss=0, dpr=1;
function viewSize(){
  const vv=window.visualViewport;
  const W=Math.round(vv ? vv.width : window.innerWidth);
  const H=Math.round(vv ? vv.height : window.innerHeight);
  return {W,H};
}
let lastSizeCheck=0;
function resizeIfNeeded(force){
  const now=performance.now();
  if(!force && now-lastSizeCheck<600) return;
  lastSizeCheck=now;
  const {W,H}=viewSize();
  const d=window.devicePixelRatio||1;
  const tw=Math.round(W*d), th=Math.round(H*d);
  if(Math.abs(cv.width-tw)>2 || Math.abs(cv.height-th)>2) resize();
}
function resize(){
  dpr = window.devicePixelRatio || 1;
  const vs=viewSize();
  const W = vs.W, H = vs.H;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  // 每个美术像素占 P 个设备像素（偶数，配合 2 倍内部渲染）
  let P = Math.round(Math.min(cv.width, cv.height)/195);
  P = Math.max(4, P - (P%2));
  cssScale = P;
  // 可视区域随屏幕自适应，填满
  VW = Math.min(WORLD_W, Math.floor(cv.width/P));
  VH = Math.min(WORLD_H, Math.floor(cv.height/P));
  off.width = VW*RES; off.height = VH*RES;
  octx.imageSmoothingEnabled = false;
  octx.setTransform(RES,0,0,RES,0,0);
  oxCss = Math.floor((cv.width - VW*P)/2);
  oyCss = Math.floor((cv.height - VH*P)/2);
  ctx.imageSmoothingEnabled = false;
  JBX = VW*0.20; JBY = VH*0.70;
}
resize();
window.addEventListener('resize', ()=>{ resize(); checkOrientation(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(resize, 200); setTimeout(resize, 600); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{ setTimeout(()=>resizeIfNeeded(true), 240); });
}
window.addEventListener('load', ()=>{ resize(); setTimeout(resize, 250); setTimeout(resize, 900); setTimeout(resize, 1800); });

// ---------- 确定性随机 ----------
function hash(x,y){
  let h = (x|0)*374761393 + (y|0)*668265263;
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}

// ---------- 世界生成 ----------
// 0 草地  2 边界丘陵
const world = [];
for(let y=0;y<WROWS;y++){
  const row=[];
  for(let x=0;x<WCOLS;x++){
    const edge=Math.min(x,y,WCOLS-1-x,WROWS-1-y);
    row.push(edge<3?2:0);
  }
  world.push(row);
}

// ---------- 房屋 ----------
const BUILDINGS = [
  {x:440, y:280, w:88, h:76, v:0, c:0, ch:1, f:0},
  {x:556, y:300, w:64, h:60, v:1, c:0, f:0},
  {x:330, y:270, w:64, h:58, v:2, c:0, f:0},
  {x:240, y:330, w:56, h:54, v:3, c:0, f:1},
  {x:740, y:270, w:66, h:60, v:1, c:1, f:1},
  {x:820, y:330, w:60, h:56, v:2, c:1, ch:1, f:1},
  {x:530, y:170, w:70, h:64, v:0, c:2, f:1},
  {x:400, y:170, w:58, h:52, v:3, c:1, f:2},
];

// ---------- 道路（土黄路，宽窄不一） ----------
const ROADS = [
  {x1:680, y1:-20, x2:680, y2:760, w:46},  // 主路（竖）
  {x1:60,  y1:440, x2:980, y2:440, w:40},  // 横路
  {x1:484, y1:356, x2:484, y2:440, w:24},  // A 大房子
  {x1:588, y1:360, x2:588, y2:440, w:24},  // B 小店
  {x1:362, y1:328, x2:362, y2:440, w:22},  // C 石屋
  {x1:268, y1:384, x2:268, y2:440, w:22},  // D 茅草屋
  {x1:773, y1:330, x2:773, y2:440, w:22},  // E 东小店
  {x1:850, y1:386, x2:850, y2:440, w:22},  // F 石屋
  {x1:600, y1:205, x2:680, y2:205, w:22},  // G 北民居
  {x1:429, y1:222, x2:429, y2:440, w:22},  // H 茅草屋
];

// ---------- 路面遮罩（2 像素一格，边缘随机） ----------
const MW=Math.ceil(WORLD_W/2), MH=Math.ceil(WORLD_H/2);
const roadMask=new Uint8Array(MW*MH);
const tileRoadCnt=new Uint8Array(WCOLS*WROWS);
for(let my=0;my<MH;my++) for(let mx=0;mx<MW;mx++){
  const wx=mx*2+1, wy=my*2+1;
  let best=1e9;
  for(const r of ROADS){ const d=segDist(wx,wy,r.x1,r.y1,r.x2,r.y2)-r.w/2; if(d<best) best=d; }
  const n=(hash(mx*7+3,my*5+1)-0.5)*6;
  roadMask[my*MW+mx]=(best+n<0)?1:0;
}
for(let ty=0;ty<WROWS;ty++) for(let tx=0;tx<WCOLS;tx++){
  let c=0;
  for(let j=0;j<8;j++) for(let i=0;i<8;i++) c+=roadMask[(ty*8+j)*MW+(tx*8+i)]||0;
  tileRoadCnt[ty*WCOLS+tx]=c;
}

// ---------- 河流与桥 ----------
const RIVER={x1:-30,y1:540,x2:1060,y2:540,w:78};
const BRIDGE={x:655,y:490,w:48,h:104};
const waterMask=new Uint8Array(MW*MH);
const tileWaterCnt=new Uint8Array(WCOLS*WROWS);
for(let my=0;my<MH;my++) for(let mx=0;mx<MW;mx++){
  const wx=mx*2+1, wy=my*2+1;
  let d=segDist(wx,wy,RIVER.x1,RIVER.y1,RIVER.x2,RIVER.y2)-RIVER.w/2;
  d += (hash(mx*3+7,my*9+2)-0.5)*7;
  waterMask[my*MW+mx]=(d<0)?1:0;
}
for(let ty=0;ty<WROWS;ty++) for(let tx=0;tx<WCOLS;tx++){
  let c=0;
  for(let j=0;j<8;j++) for(let i=0;i<8;i++) c+=waterMask[(ty*8+j)*MW+(tx*8+i)]||0;
  tileWaterCnt[ty*WCOLS+tx]=c;
}
function waterAt(px,py){
  if(px>BRIDGE.x&&px<BRIDGE.x+BRIDGE.w&&py>BRIDGE.y&&py<BRIDGE.y+BRIDGE.h) return false;
  const mx=Math.floor(px/2), my=Math.floor(py/2);
  if(mx<0||my<0||mx>=MW||my>=MH) return false;
  return waterMask[my*MW+mx]===1;
}

// ---------- 边界装饰（大小/种类不一的丘陵、树、灌木、草、花、石） ----------
const borderDeco = [];
(()=>{
  for(let y=0;y<WROWS;y++) for(let x=0;x<WCOLS;x++){
    if(world[y][x]!==2) continue;
    if(hash(x*7+1,y*11+3) < 0.22) continue;
    const jx=(hash(x+9,y+4)-0.5)*TILE*0.8;
    const jy=(hash(x+2,y+8)-0.5)*TILE*0.8;
    const s=0.6+hash(x+5,y+7)*1.0;
    const t=hash(x+3,y+9);
    let type;
    if(t<0.28) type='tree';
    else if(t<0.40) type='pine';
    else if(t<0.58) type='mound';
    else if(t<0.72) type='bush';
    else if(t<0.84) type='grass';
    else if(t<0.93) type='flower';
    else type='rock';
    borderDeco.push({type, x:x*TILE+TILE/2+jx, y:y*TILE+TILE/2+jy, s, v:hash(x+1,y+2)});
  }
})();

// ---------- 状态 ----------
let state='menu', last=0;
let camX=0, camY=0, camXs=0, camYs=0, walkPhase=0;
let player = { x:680, y:448, hp:100, maxHp:100, r:6, speed:120, face:1 };
const BUILD='v1.0-M1';
let sessionSec=0;
let money=0;   // 铜币
function fmtMoney(cu){
  cu=Math.max(0,Math.floor(cu||0));
  const d=Math.floor(cu/1e9), g=Math.floor(cu/1e6)%1000, s2=Math.floor(cu/1000)%1000, c=cu%1000;
  let o='';
  if(d) o+=d+'钻';
  if(g) o+=(o?' ':'')+g+'金';
  if(s2) o+=(o?' ':'')+s2+'银';
  if(c||!o) o+=(o?' ':'')+c+'铜';
  return o;
}
let level=0, xp=0, xpNeed=100;
function nextXpNeed(cur){ return Math.max(1, Math.round((cur||100)*1.07)); }

function resetGame(){
  player = { x:680, y:448, hp:100, maxHp:100, r:6, speed:120, face:1 };
  level=0; xp=0; xpNeed=100; walkPhase=0; lastStep=-1;
  EQUIP.weapons=['woodsword',null,null];
  EQUIP.armors=['woodhelm','woodchest','woodlegs'];
  try{ ['woodsword','woodhelm','woodchest','woodlegs'].forEach(markSeen); }catch(e){}

  camX=Math.max(0,Math.min(WORLD_W-VW, player.x-VW/2));
  camY=Math.max(0,Math.min(WORLD_H-VH, player.y-VH/2));
  camXs=camX; camYs=camY;
}

// ---------- 输入（常驻摇杆，仅右下角 1/4 可操作） ----------
let joy={active:false, dx:0, dy:0};
function toV(x,y){ return [((x*dpr)-oxCss)/cssScale, ((y*dpr)-oyCss)/cssScale]; }
function joyMove(vx,vy){
  const dx=vx-JBX, dy=vy-JBY, d=Math.hypot(dx,dy), m=d>JR?JR/d:1;
  joy.dx=dx*m; joy.dy=dy*m;
}
let lastTouchAt=0;
function handleTap(vx,vy){
  if(state!=='city') return;
  if(anyModalOpen()) return;
  if(hudTapEnabled && vx<112 && vy<42){ try{ openChar(); }catch(err){} return; }
  if(equipHudOn){
    const El=equipLayout();
    // 武器组：只切换手持，任何情况下都不打开装备面板
    if(vx>=El.wx-4 && vx<=El.wx+El.GW+4 && vy>=El.wy && vy<=El.wy+El.GH){
      const rel=(vx-El.wx-El.pad)/(El.WS+4);
      const idx=Math.max(0,Math.min(2,Math.round(rel)));
      if(EQUIP.weapons[idx]){ heldSlot=idx; sfxBeep(); vibrate(2); updateHudButtons(); }
      return;
    }
    const H=El.hudBox;
    if(vx>=El.swx&&vx<=El.swx+El.swordW&&vy>=El.swy&&vy<=El.swy+El.swordH){ openEquip(); return; }
    if(vx>=H.x0&&vx<=H.x1&&vy>=H.y0&&vy<=H.y1){ openEquip(); return; }
  }
  if(vx < VW*0.5 && vy > VH*0.5){ joy.active=true; joyMove(vx,vy); vibrate(1); }
}
cv.addEventListener('touchstart', e=>{
  lastTouchAt=performance.now();
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  handleTap(vx,vy);
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if(!joy.active) return;
  const t=e.touches[0]; const [vx,vy]=toV(t.clientX,t.clientY);
  joyMove(vx,vy);
}, {passive:true});
cv.addEventListener('touchend', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('touchcancel', ()=>{ joy.active=false; joy.dx=joy.dy=0; }, {passive:true});
cv.addEventListener('mousedown', e=>{
  // 触摸后浏览器会补发 mousedown，忽略它，避免重复处理
  if(performance.now()-lastTouchAt < 700) return;
  const [vx,vy]=toV(e.clientX,e.clientY);
  handleTap(vx,vy);
});
cv.addEventListener('mousemove', e=>{ if(!joy.active)return; const [vx,vy]=toV(e.clientX,e.clientY); joyMove(vx,vy); });
cv.addEventListener('mouseup', ()=>{ joy.active=false; joy.dx=joy.dy=0; });

// ---------- 碰撞 ----------
function solidAt(px,py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=WCOLS||ty>=WROWS) return true;
  if(world[ty][tx]!==0) return true;
  for(const b of BUILDINGS){ if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) return true; }
  for(const p of PROPS){
    let x0,y0,x1,y1;
    if(p.type==='well'){ x0=p.x-14; y0=p.y-8; x1=p.x+14; y1=p.y+1; }
    else if(p.type==='flower'){ x0=p.x-13; y0=p.y-7; x1=p.x+13; y1=p.y+1; }
    else if(p.type==='crate'){ x0=p.x-6; y0=p.y-10; x1=p.x+6; y1=p.y; }
    else if(p.type==='lamp'){ x0=p.x-3; y0=p.y-7; x1=p.x+3; y1=p.y; }
    else if(p.type==='fence'){ x0=p.x; y0=p.y-12; x1=p.x+(p.n||5)*6; y1=p.y; }
    else continue;
    if(px>=x0&&px<=x1&&py>=y0&&py<=y1) return true;
  }
  if(waterAt(px,py)) return true;
  return false;
}
function tryMove(dx,dy){
  const half=5, nx=player.x+dx, ny=player.y+dy;
  const ok=(x,y)=> !solidAt(x,y)&&!solidAt(x-half,y-half)&&!solidAt(x+half,y-half)&&!solidAt(x-half,y+half)&&!solidAt(x+half,y+half);
  if(ok(nx,ny)){ player.x=nx; player.y=ny; return; }
  if(ok(nx,player.y)) player.x=nx;
  if(ok(player.x,ny)) player.y=ny;
}

function update(dt){
  if(inShop){ updateShop(dt); return; }
  if(dead){ updateSlime(dt); updateOrbs(dt); updateCombatFx(dt); updateFootParts(dt); updateDmgNums(dt); return; }
  let mvx=0, mvy=0;
  if(!talking){
    if(joy.active && Math.hypot(joy.dx,joy.dy)>2){ mvx=joy.dx; mvy=joy.dy; }
    else {
      if(keys['a']||keys['arrowleft']) mvx-=1;
      if(keys['d']||keys['arrowright']) mvx+=1;
      if(keys['w']||keys['arrowup']) mvy-=1;
      if(keys['s']||keys['arrowdown']) mvy+=1;
    }
  }
  if(Math.abs(pvx)>0.5||Math.abs(pvy)>0.5){
    tryMove(pvx*dt, pvy*dt);
    pvx*=Math.pow(0.0008,dt); pvy*=Math.pow(0.0008,dt);
    if(Math.abs(pvx)<3) pvx=0;
    if(Math.abs(pvy)<3) pvy=0;
  }
  const mag=Math.hypot(mvx,mvy);
  if(mag>0){
    tryMove(mvx/mag*player.speed*dt, mvy/mag*player.speed*dt);
    walkPhase += dt*16;
    const si=Math.floor(walkPhase/Math.PI);
    if(si!==lastStep){ lastStep=si; playStep(); spawnFoot(); if(si%2===0) vibrate(1); }
    if(mvx>0) player.face=1; else if(mvx<0) player.face=-1;
  } else {
    walkPhase = 0;
    lastStep = -1;
  }
  if(attacking>0) attacking=Math.max(0,attacking-dt);
  if(atkCd>0) atkCd=Math.max(0,atkCd-dt);
  updateFootParts(dt);
  updateDmgNums(dt);
  updateFlow();
  updateDeathFx(dt);
  updatePotion(dt);
  updateHeals(dt);
  updateSlime(dt);
  updateOrbs(dt);
  updateCombatFx(dt);
  if(DUMMY.flash>0) DUMMY.flash=Math.max(0,DUMMY.flash-dt);
  if(DUMMY.shake>0) DUMMY.shake=Math.max(0,DUMMY.shake-dt);
  if(player.maxMp) player.mp = Math.min(player.maxMp, (player.mp||0) + dt*0.25);
  if(solidAt(player.x,player.y)){
    let freed=false;
    for(const d of [[0,-4],[0,4],[-4,0],[4,0],[-4,-4],[4,-4],[-4,4],[4,4],[0,-8],[0,8],[-8,0],[8,0]]){
      if(!solidAt(player.x+d[0],player.y+d[1])){ player.x+=d[0]; player.y+=d[1]; freed=true; break; }
    }
    if(!freed){ player.x=680; player.y=448; }
  }
  const tcx=Math.max(0, Math.min(WORLD_W-VW, player.x-VW/2));
  const tcy=Math.max(0, Math.min(WORLD_H-VH, player.y-VH/2));
  const k=1-Math.exp(-dt*12);
  camXs += (tcx-camXs)*k;
  camYs += (tcy-camYs)*k;
  if(!isFinite(camXs)||!isFinite(camYs)){ camXs=tcx; camYs=tcy; }
  camX = Math.round(camXs*RES)/RES;
  camY = Math.round(camYs*RES)/RES;
  updateInteract();
}

function px(x,y,w,h,c){ octx.fillStyle=c; octx.fillRect(Math.round(x*RES)/RES,Math.round(y*RES)/RES,Math.round(w*RES)/RES,Math.round(h*RES)/RES); }
function fillCircle(x,y,r,c){ octx.fillStyle=c; octx.beginPath(); octx.arc(x,y,r,0,7); octx.fill(); }

function drawGrass(sx,sy,tx,ty){
  const h=hash(tx,ty);
  if(h<0.2){ octx.fillStyle='#74a852'; octx.fillRect(sx,sy,TILE,TILE); }
  else if(h>0.55 && h<0.65){ octx.fillStyle='#88bf66'; octx.fillRect(sx,sy,TILE,TILE); }
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*13+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-3));
    px(bx,by,1,2,'#639a45');
  }
  if(h>0.92){
    const fx=sx+4+Math.floor(hash(tx,ty)*6), fy=sy+4+Math.floor(hash(ty,tx)*6);
    px(fx,fy,2,2,'#fde047'); px(fx+1,fy+1,1,1,'#f59e0b');
  } else if(h<0.05){
    px(sx+5,sy+8,4,3,'#9aa5b1'); px(sx+6,sy+7,2,1,'#b4bec8');
  } else if(h>0.82 && h<0.86){
    px(sx+9,sy+10,5,4,'#4e7d36'); px(sx+10,sy+9,3,2,'#5f9440');
  }
}
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
  let t = l2 ? ((px-x1)*dx+(py-y1)*dy)/l2 : 0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function roadVal(tx,ty){
  const cx=tx*TILE+TILE/2, cy=ty*TILE+TILE/2;
  let best=1e9;
  for(const r of ROADS){
    const d=segDist(cx,cy,r.x1,r.y1,r.x2,r.y2)-r.w/2;
    if(d<best) best=d;
  }
  const n=(hash(tx*5+1,ty*7+3)-0.5)*10;
  const v=best+n;
  if(v<=-7) return 1;
  if(v>=7) return 0;
  return (7-v)/14;
}
function drawDirt(sx,sy,tx,ty,rv){
  octx.fillStyle='#c9a96b'; octx.fillRect(sx,sy,TILE,TILE);
  for(let i=0;i<3;i++){
    const bx=sx+Math.floor(hash(tx*7+i,ty*11+i)*(TILE-2));
    const by=sy+Math.floor(hash(tx*3+i,ty*5+i)*(TILE-2));
    px(bx,by,2,1, hash(tx+i,ty+i)>0.5?'#d8bd85':'#b08f55');
  }
  // 边缘随机混草，形成不规则路沿
  if(rv<0.85){
    const n=Math.floor((1-rv)*9);
    for(let i=0;i<n;i++){
      const bx=sx+Math.floor(hash(tx*13+i,ty*7+i)*TILE);
      const by=sy+Math.floor(hash(tx*5+i,ty*13+i)*TILE);
      px(bx,by,2,1,'#7db25a');
    }
  }
  if(hash(tx,ty)>0.85) px(sx+6,sy+9,3,2,'#9aa5b1');
}
function drawGroundTile(sx,sy,tx,ty){
  const cnt=tileRoadCnt[ty*WCOLS+tx];
  if(cnt===0){ drawGrass(sx,sy,tx,ty); return; }
  if(cnt>=64){ drawDirt(sx,sy,tx,ty,1); return; }
  drawGrass(sx,sy,tx,ty);
  for(let j=0;j<8;j++) for(let i=0;i<8;i++){
    if(roadMask[(ty*8+j)*MW+(tx*8+i)]){
      px(sx+i*2, sy+j*2, 2, 2, hash(tx*8+i,ty*8+j)>0.5?'#c9a96b':'#bfa06a');
    }
  }
}
function drawWaterTile(sx,sy,tx,ty){
  const cnt=tileWaterCnt[ty*WCOLS+tx];
  if(cnt===0){ drawGroundTile(sx,sy,tx,ty); return; }
  if(cnt>=64){
    px(sx,sy,TILE,TILE,'#2f6fb0');

  for(let j=0;j<8;j++) for(let i=0;i<8;i++){

  px(x+4, baseY, w-8, 8, '#8d8a80');

    px(x+4, wallTop-2, 3, h-roofH+2, pal.beam);
    px(x+w-7, wallTop-2, 3, h-roofH+2, pal.beam);
    px(x+4, wallTop-2, w-8, 2, pal.beam);
    px(x+4, baseY-2, w-8, 2, pal.beam);
    if(st.type==='shop'){ for(let i=0;i<3;i++) px(x+9+i, wallTop+3+i*5, 2, 5, pal.beam); }
  }

  // 烟囱：只给带 ch 的房子，先画再被屋顶盖住

  px(x+2, wallTop-2, w-4, 2, 'rgba(0,0,0,.16)');

function drawHero(){
  const cx=Math.round((player.x-camX)*RES)/RES, cy=Math.round((player.y-camY)*RES)/RES;
  octx.fillStyle='rgba(0,0,0,.28)';
  octx.beginPath(); octx.ellipse(cx, cy+8, 5, 2, 0, 0, 7); octx.fill();

  const moving = (joy.active && (Math.abs(joy.dx)+Math.abs(joy.dy))>2) || keysDown();
  const sw = moving ? Math.sin(walkPhase)*2.0 : 0;
  const ab = moving ? Math.sin(walkPhase)*1.3 : 0;
  const bounce = moving ? Math.abs(Math.sin(walkPhase))*1.4 : 0;
  const atkP = attacking>0 ? 1 - attacking/ATK_DUR : -1;
  const lean = atkP>=0 ? Math.sin(Math.min(1,atkP*1.4)*Math.PI)*1.2 : 0;

  octx.save();
  octx.translate(Math.round((cx+lean*player.face)*RES)/RES, Math.round((cy-bounce)*RES)/RES);
  if(player.face<0) octx.scale(-1,1);

  // 身体
  px(-4, -5, 9, 9, '#6d1a1a');
  px(-2+sw, 4, 2, 4, '#17171a');
  px(0.5-sw, 4, 2, 4, '#17171a');
  px(-2.5+sw, 7, 3, 2, '#050507');
  px(0.5-sw, 7, 3, 2, '#050507');
  px(-3, -4, 7, 8, '#141416');
  px(-3, -4, 7, 1, '#2a2a30');
  px(0, -3, 1, 5, '#b91c1c');
  px(-1, -3, 3, 1, '#b91c1c');
  px(1, -1, 1, 1, '#d4b24a');
  px(1, 1, 1, 1, '#d4b24a');
  // 左臂
  px(-5, -4-ab, 2, 4, '#141416');
  px(-5, 0-ab, 2, 2, '#08080a');
  // 右臂：持武器时由武器替代，不再画手
  const holding = EQUIP.weapons[heldSlot] && ITEMS[EQUIP.weapons[heldSlot]];
  if(!holding){
    if(atkP>=0){
      px(3, -4, 4, 2, '#141416');
      px(6, -4, 2, 2, '#08080a');
    } else {
      px(4, -4+ab, 2, 4, '#141416');
      px(4, 0+ab, 2, 2, '#08080a');
    }
  }
  // 头
  px(-2, -8, 5, 4, '#f0c9a0');
  px(-2, -7, 2, 2, '#f2c23c');
  px(1, -7, 2, 2, '#f2c23c');
  px(-3, -10, 7, 2, '#191919');
  px(-4, -9, 2, 4, '#191919');
  px(3, -9, 2, 4, '#191919');
  px(-3, -11, 2, 1, '#191919');
  px(1, -11, 2, 1, '#191919');
  px(-1, -12, 1, 2, '#191919');
  px(2, -12, 1, 2, '#191919');
  px(2, -10, 2, 3, '#de2b2b');

  // 手持武器
  const wid = EQUIP.weapons[heldSlot];
  if(wid && ITEMS[wid]){
    const im = itemImg(ITEMS[wid].ic);
    let ang;
    if(atkP>=0) ang = -1.15 + 2.5*Math.min(1, atkP*1.35);
    else ang = 0.55 + (moving?Math.sin(walkPhase)*0.10:0);
    const hx = atkP>=0 ? 6.5 : 4.5;
    const hy = atkP>=0 ? -1.5 : 0.5;
    octx.save();
    octx.translate(hx, hy);
    octx.rotate(ang);
    if(im && im.complete && im.naturalWidth>0){
      const sc=21;
      octx.imageSmoothingEnabled=false;
      octx.drawImage(im, -0.13*sc, -0.83*sc, sc, sc);
      octx.imageSmoothingEnabled=true;
    } else {
      // 兜底：像素木剑
      octx.fillStyle='#c98a4b'; octx.fillRect(-1,-19,3,17);
      octx.fillStyle='#e0a86a'; octx.fillRect(-1,-19,1,17);
      octx.fillStyle='#8a5a2b'; octx.fillRect(-5,-3,11,2);
      octx.fillStyle='#6b4423'; octx.fillRect(-1,-1,3,6);
      octx.fillStyle='#a87c50'; octx.fillRect(-2,5,5,2);
    }
    octx.restore();
  }

  // 挥砍残影
  if(atkP>=0){
    const a0=-1.15;
    const head=a0+2.5*Math.min(1, atkP*1.3);
    const N=16, fade=1-atkP*0.5;
    octx.lineCap='round';
    for(let k=0;k<N;k++){
      const t0=a0+(head-a0)*(k/N), t1=a0+(head-a0)*((k+1)/N);
      const a=Math.pow(k/N,1.8)*0.9*fade;
      if(a<=0.012) continue;
      octx.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';
      octx.lineWidth=4;
      octx.beginPath(); octx.arc(1,-4,16,t0,t1); octx.stroke();
    }
    octx.strokeStyle='rgba(255,255,255,'+(0.9*fade).toFixed(3)+')';
    octx.lineWidth=1.5;
    octx.beginPath(); octx.arc(1,-4,16,Math.max(a0,head-0.14),head); octx.stroke();
  }

  octx.restore();
}

const CHUNK=256;
const chunkCache=new Map();
const probeCv=document.createElement('canvas'); probeCv.width=1; probeCv.height=1;
const probeCtx=probeCv.getContext('2d');
let chunkCheckTick=0;
function chunkAlive(ch){
  try{
    if(!ch||!ch.cv) return false;
    probeCtx.clearRect(0,0,1,1);
    probeCtx.drawImage(ch.cv, 8, 8, 1, 1, 0, 0, 1, 1);
    const d=probeCtx.getImageData(0,0,1,1).data;
    return d[3] > 0;
  }catch(e){ return true; }
}
let chunkCheckIdx=0;
function validateChunks(cx0,cx1,cy0,cy1){
  const keys=[];
  for(let cy=cy0; cy<=cy1; cy++) for(let cx=cx0; cx<=cx1; cx++) keys.push(cx*1000+cy);
  if(!keys.length) return;
  chunkCheckIdx=(chunkCheckIdx+1)%keys.length;
  const key=keys[chunkCheckIdx];
  const ch=chunkCache.get(key);
  if(ch && !chunkAlive(ch)) chunkCache.delete(key);
}
function buildChunk(cx,cy){
  const key=cx*1000+cy;
  if(chunkCache.has(key)) return chunkCache.get(key);
  let rec=null;
  try{
    const cv=document.createElement('canvas');
    cv.width=CHUNK*RES; cv.height=CHUNK*RES;
    const g=cv.getContext('2d');
    if(g){
      g.imageSmoothingEnabled=false;
      g.setTransform(RES,0,0,RES,0,0);
      const x0=cx*CHUNK, y0=cy*CHUNK;
      const saved=octx; octx=g;
      const tx0=Math.max(0,Math.floor(x0/TILE)), tx1=Math.min(WCOLS, Math.ceil((x0+CHUNK)/TILE));
      const ty0=Math.max(0,Math.floor(y0/TILE)), ty1=Math.min(WROWS, Math.ceil((y0+CHUNK)/TILE));
      for(let ty=ty0; ty<ty1; ty++) for(let tx=tx0; tx<tx1; tx++){
        const sx=tx*TILE-x0, sy=ty*TILE-y0, t=world[ty][tx];
        if(t===0){ if(tileWaterCnt[ty*WCOLS+tx]>0) drawWaterTile(sx,sy,tx,ty); else drawGroundTile(sx,sy,tx,ty); }
        else drawBoundaryBase(sx,sy,tx,ty);
      }
      octx=saved;
      rec={cv,x0,y0};
    }
  }catch(e){ rec=null; try{ octx=globalThis.__mainOctx||octx; }catch(_){} }
  chunkCache.set(key,rec);
  return rec;
}

function render(){
  octx.clearRect(0,0,VW,VH);
  octx.fillStyle='#7db25a'; octx.fillRect(0,0,VW,VH);
  if(inShop){ renderShopRoom(); return; }

  {
    const cx0=Math.floor(camX/CHUNK), cx1=Math.floor((camX+VW-0.01)/CHUNK);
    const cy0=Math.floor(camY/CHUNK), cy1=Math.floor((camY+VH-0.01)/CHUNK);
    chunkCheckTick++;
    if(chunkCheckTick%420===0) validateChunks(cx0,cx1,cy0,cy1);
    for(let cy=cy0; cy<=cy1; cy++) for(let cx=cx0; cx<=cx1; cx++){
      const ch=buildChunk(cx,cy);
      if(ch){
        octx.setTransform(1,0,0,1,0,0);
        octx.drawImage(ch.cv, Math.round((ch.x0-camX)*RES), Math.round((ch.y0-camY)*RES));
        octx.setTransform(RES,0,0,RES,0,0);
      } else {
        const tx0=Math.max(0,Math.floor((cx*CHUNK)/TILE)), tx1=Math.min(WCOLS,Math.ceil(((cx+1)*CHUNK)/TILE));
        const ty0=Math.max(0,Math.floor((cy*CHUNK)/TILE)), ty1=Math.min(WROWS,Math.ceil(((cy+1)*CHUNK)/TILE));
        for(let ty=ty0; ty<ty1; ty++) for(let tx=tx0; tx<tx1; tx++){
          const sx=tx*TILE-camX, sy=ty*TILE-camY;
          if(sx+TILE<0||sy+TILE<0||sx>VW||sy>VH) continue;
          const t=world[ty][tx];
          if(t===0){ if(tileWaterCnt[ty*WCOLS+tx]>0) drawWaterTile(sx,sy,tx,ty); else drawGroundTile(sx,sy,tx,ty); }
          else drawBoundaryBase(sx,sy,tx,ty);
        }
      }
    }
    drawBridge();
  }
  drawAmbient();
  drawFootParts();
  drawOrbs();
  drawDrops();
  const ds=[];
  const vx0=camX-40, vx1=camX+VW+40, vy0=camY-60, vy1=camY+VH+40;
  const vis=(x,y,w,h)=> !(x+w<vx0 || x>vx1 || y+h<vy0 || y>vy1);
  for(const b of BUILDINGS) if(vis(b.x,b.y-24,b.w,b.h+40)) ds.push({bottom:b.y+b.h, draw:()=>drawHouse(b)});
  for(const p of PROPS) if(vis(p.x-40,p.y-40,80,80)) ds.push({bottom:p.y, draw:()=>drawProp(p)});
  if(vis(NPC.x-16,NPC.y-24,32,40)) ds.push({bottom:NPC.y, draw:drawNPC});
  if(vis(DUMMY.x-12,DUMMY.y-26,24,30)) ds.push({bottom:DUMMY.y, draw:drawDummy});
  for(const sl of slimes) ds.push({bottom:sl.y, draw:()=>drawSlime(sl)});
  if(vis(ELDER.x-8,ELDER.y-20,16,30)) ds.push({bottom:ELDER.y, draw:drawElder});
  if(vis(OFFICER.x-8,OFFICER.y-20,16,30)) ds.push({bottom:OFFICER.y, draw:drawOfficer});
  ds.push({bottom:SHOP_DOOR.y+2, draw:drawShopDoorMark});
  ds.push({bottom:REVIVE_POINT.y, draw:drawShrine});
  ds.push({bottom:99999, draw:drawGate});
  ds.sort((a,b)=>a.bottom-b.bottom);
  for(const d of ds){ if(d.bottom<=player.y) d.draw(); }
  if(dead){ octx.globalAlpha=0.45; drawHero(); octx.globalAlpha=1; }
  else drawHero();
  for(const d of ds){ if(d.bottom>player.y) d.draw(); }
  if(dead){
    octx.globalAlpha=Math.min(0.34, 0.10+deathT*0.08);
    octx.fillStyle='#b91c1c';
    octx.fillRect(0,0,VW,VH);
    octx.globalAlpha=1;
  }
  drawHeals();
  drawPlayerHurt();
  drawInteractMarkers();
  if(dead) drawDeathFx();
  drawDmgNums();
  drawHUD();
  if(showFps){ const ft=fpsVal+' FPS'; drawText(ft, 4, 41, '#4ade80'); }
  if(gtime - saveMsgT < 1.3){
    octx.globalAlpha = Math.max(0, 1-(gtime-saveMsgT)/1.3);
    drawText('OK', 4, 51, '#4ade80');
    octx.globalAlpha = 1;
  }
  drawMini();
  drawCharPortrait();
  if(paused){
    octx.font='8px Zpix, monospace'; octx.textBaseline='top';
    octx.fillStyle='rgba(0,0,0,.55)';
    octx.fillRect(VW/2-24, 14, 48, 12);
    octx.fillStyle='#f5e6cf';
    octx.fillText('暂停中', VW/2-12, 17);
  }
  if(state==='city'){ if(equipHudOn && !talking) drawEquipHUD(); drawJoystick(); drawCoinHud(); }

  blitToScreen();
}

let errStreak=0;
let lastErr='', lastErrAt=0;
function showFatal(msg){
  try{
    const now=performance.now();
    if(msg===lastErr && now-lastErrAt<3000) return;
    lastErr=msg; lastErrAt=now;
    const d=document.getElementById('errBox');
    if(d){ d.style.display='block'; d.textContent='⚠ '+msg; }
    try{ localStorage.setItem('xingchen_err', String(msg).slice(0,300)); }catch(e){}
  }catch(e){}
}
window.addEventListener('error', (e)=>{ showFatal(e.message||'unknown'); });
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(!paused) gtime += dt;
  if(state==='city' && !paused){
    sessionSec += dt; stats.totalSec += dt; statPlayAcc += dt; statHitAcc += dt;
    if(gtime - statsFlushAt > 10){ statsFlushAt=gtime; saveStats(); }
    if(statHitAcc >= 60){ statHitAcc=0; statHit('playtime'); }
  }
  try{
    if(state==='city' && !paused) update(dt);
    render();
  }catch(e){
    showFatal((e&&e.message)||'render error');
    errStreak++;
    if(errStreak>8 && inShop){ try{ inShop=false; if(townPos){ player.x=townPos.x; player.y=townPos.y+12; } }catch(e2){} errStreak=0; }
    if(errStreak>20){ try{ location.reload(); }catch(e3){} }
  }
  if(!inShop) errStreak=Math.max(0,errStreak-1);
  if((fpsFrames & 31)===0) resizeIfNeeded();
  fpsFrames++;
  if(now-fpsLast>=500){
    fpsVal = Math.round(fpsFrames*1000/(now-fpsLast));
    fpsFrames=0; fpsLast=now;
  }
  requestAnimationFrame(frame);
}

// ---------- 背景音乐（舒缓合成） ----------
let actx=null, master=null, noteBus=null, sfxGain=null, musicOn=true, sfxOn=true, schedStarted=false;
let musicVol=0.6, sfxVol=0.7, noiseBuf=null, lastStep=-1;
let nextTime=0, beatIndex=0;
const BPM=72, BEAT=60/BPM;
const BEAT_TOWN=60/126;
const TOWN_BARS=[
  {chord:[293.66,369.99,440.00,587.33], bass:146.83},
  {chord:[329.63,415.30,493.88,659.25], bass:164.81},
  {chord:[261.63,329.63,392.00,523.25], bass:130.81},
  {chord:[349.23,440.00,523.25,698.46], bass:174.61},
];
const TOWN_PENTA=[587.33,659.25,739.99,880.00,987.77,1174.66];
let musicMood='title';
function curBeat(){ return musicMood==='town'?BEAT_TOWN:BEAT; }
function setMusicMood(m){ musicMood=m; beatIndex=0; if(actx) nextTime=actx.currentTime+0.1; }

function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  master=actx.createGain(); master.gain.value=musicOn?musicVol*0.8:0; master.connect(actx.destination);
  sfxGain=actx.createGain(); sfxGain.gain.value=sfxOn?sfxVol*0.9:0; sfxGain.connect(actx.destination);
  const nlen=Math.floor(actx.sampleRate*0.2);
  noiseBuf=actx.createBuffer(1,nlen,actx.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nlen;i++) nd[i]=Math.random()*2-1;
  const lp=actx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=1500; lp.Q.value=0.2; lp.connect(master);
  noteBus=actx.createGain(); noteBus.gain.value=0.5; noteBus.connect(lp);
  const delay=actx.createDelay(1.0); delay.delayTime.value=0.36;
  const fb=actx.createGain(); fb.gain.value=0.28;
  const wet=actx.createGain(); wet.gain.value=0.22;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  const send=actx.createGain(); send.gain.value=0.35;
  noteBus.connect(send); send.connect(delay);
}
function note(freq, t, dur, type, vol, atk, rel){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur+rel);
  o.connect(g); g.connect(noteBus);
  o.start(t); o.stop(t+dur+rel+0.05);
}
const BARS=[
  {chord:[261.63,329.63,392.00,493.88], bass:130.81},
  {chord:[220.00,261.63,329.63,392.00], bass:110.00},
  {chord:[174.61,220.00,261.63,329.63], bass:87.31},
  {chord:[196.00,246.94,293.66,392.00], bass:98.00},
];
const PENTA=[523.25,587.33,659.25,783.99,880.00];
function scheduleBeat(bi, t){
  const town=musicMood==='town';
  const bars=town?TOWN_BARS:BARS, penta=town?TOWN_PENTA:PENTA, beat=curBeat();
  const bar=Math.floor(bi/4)%bars.length, b=bi%4;
  if(b===0){
    for(const f of bars[bar].chord) note(f, t, beat*4*0.9, 'sine', 0.05, 0.8, 1.4);
    note(bars[bar].bass, t, beat*4*0.85, 'sine', 0.09, 0.5, 1.2);
  }
  if((b===2 && Math.random()<(town?0.92:0.55)) || (b===3 && Math.random()<(town?0.75:0.22))){
    note(penta[Math.floor(Math.random()*penta.length)], t, beat*1.1, 'triangle', 0.03, 0.15, 0.9);
  }
  if(town){
    if(b===0 && Math.random()<0.7) note(penta[Math.floor(Math.random()*penta.length)]*2, t+beat*0.5, beat*0.7, 'square', 0.011, 0.1, 0.8);
    if(b===1 && Math.random()<0.7) note(penta[Math.floor(Math.random()*penta.length)]*2, t, beat*0.8, 'square', 0.012, 0.1, 0.8);
    if(b===3 && Math.random()<0.5) note(penta[Math.floor(Math.random()*penta.length)]*2, t+beat*0.5, beat*0.6, 'triangle', 0.02, 0.12, 0.8);
  }
}
function scheduler(){
  if(!actx) return;
  while(nextTime < actx.currentTime + 0.4){ scheduleBeat(beatIndex, nextTime); nextTime+=curBeat(); beatIndex++; }
}
function startMusic(){
  if(!actx) return;
  if(actx.state==='suspended') actx.resume();
  if(!schedStarted){ schedStarted=true; nextTime=actx.currentTime+0.1; beatIndex=0; setInterval(scheduler,120); }
}
function playStep(){
  if(!actx || !sfxOn || !noiseBuf) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const lp=actx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=1100+Math.random()*300; lp.Q.value=0.5;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.07, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
  src.connect(lp); lp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t+0.16);
}
let mutedAll=false, vibOn=true, vibPower=100;
const VIB={1:10, 2:20, 3:34};
function vibrate(level){
  if(!vibOn || vibPower<=0) return;
  const ms=Math.round((VIB[level]||10)*(vibPower/100));
  try{ if(ms>0 && navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}
function sfxDrop(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(1250,t);
  o.frequency.exponentialRampToValueAtTime(380,t+0.09);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.24,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t+0.15);
}
function sfxBeep(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(900,t);
  o.frequency.setValueAtTime(1340,t+0.045);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.11,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t+0.12);
}
function applyMusic(){ if(actx&&master) master.gain.setTargetAtTime((musicOn&&!mutedAll)?musicVol*0.8:0, actx.currentTime, 0.05); }
function applySfx(){ if(actx&&sfxGain) sfxGain.gain.setTargetAtTime((sfxOn&&!mutedAll)?sfxVol*0.9:0, actx.currentTime, 0.05); }

const SAVE_KEY='xingchen_huixiang_save_v1';
const SAVE_SIG='星辰回响';
const SAVE_VER=1;
let hasSave=false;

function collectSave(){
  return { sig:SAVE_SIG, ver:SAVE_VER, at:Date.now(),
    p:{ x:player.x, y:player.y, hp:player.hp, maxHp:player.maxHp, mp:player.mp, maxMp:player.maxMp, speed:120 },
    money:money,
    lv:level, xp:xp, need:xpNeed,
    bag:bagItems.map(e=>[e.id,e.n]),
    story:{ talked: storyTalked, shop: shopTalked, officer: officerTalked },
    seen:[...seenItems],
    mobs:[...seenMobs],
    eq:{ weapons:EQUIP.weapons.slice(), armors:EQUIP.armors.slice(), accessories:EQUIP.accessories.slice() } };
}
function applySave(s){
  if(!s || s.sig!==SAVE_SIG) return false;
  const p=player;
  if(s.p){
    if(!isFinite(s.p.x)||!isFinite(s.p.y)) return false;
    p.x=Math.max(0,Math.min(WORLD_W-1,s.p.x));
    p.y=Math.max(0,Math.min(WORLD_H-1,s.p.y));
    p.hp=Math.max(0,Math.min(9999, s.p.hp||100));
    p.maxHp=Math.max(1,Math.min(9999, s.p.maxHp||100));
    p.mp=Math.max(0,Math.min(9999, s.p.mp!=null?s.p.mp:(p.maxMp||30)));
    p.maxMp=Math.max(1,Math.min(9999, s.p.maxMp||30));
  }
  p.speed=120;
  if(typeof s.lv==='number') s.lv=Math.max(0,Math.min(9999,s.lv));
  if(typeof s.xp==='number') s.xp=Math.max(0,Math.min(1e9,s.xp));
  if(!isFinite(p.x)||!isFinite(p.y)||solidAt(p.x,p.y)){ p.x=680; p.y=448; }
  money=Math.max(0,Math.floor(s.money||0));
  if(s.lv>0){
    const m2=hpForLevel(s.lv); if(m2>p.maxHp){ p.hp=Math.min(m2, p.hp+(m2-p.maxHp)); p.maxHp=m2; }
    const mp2=Math.round(30*Math.pow(1.05, s.lv)); if(mp2>(p.maxMp||30)){ p.maxMp=mp2; p.mp=Math.min(mp2,(p.mp||0)); }
  }
  level=s.lv||0; xp=s.xp||0; xpNeed=s.need||100;
  if(!(xpNeed>=100)) xpNeed=100;
  if(Array.isArray(s.bag)){
    bagItems=[];
    for(const it of s.bag){
      if(typeof it==='string'){ if(ITEMS[it]) addItem(it,1); }
      else if(Array.isArray(it)){ if(ITEMS[it[0]]) addItem(it[0], it[1]||1); }
      else if(it && ITEMS[it.id]) addItem(it.id, it.n||1);
    }
  }
  if(s.story){ storyTalked=!!s.story.talked; shopTalked=!!s.story.shop; officerTalked=!!s.story.officer; }
  if(Array.isArray(s.seen)) seenItems=new Set(s.seen.filter(id=>ITEMS[id]));
  if(Array.isArray(s.mobs)) seenMobs=new Set(s.mobs.filter(m=>MOBS[m]));
  if(s.eq){
    const fix=(arr,n)=>{ const out=new Array(n).fill(null);
      if(Array.isArray(arr)) for(let i=0;i<n;i++){ const v=arr[i]; if(v && ITEMS[v]) out[i]=v; }
      return out; };
    EQUIP.weapons=fix(s.eq.weapons,3);
    EQUIP.armors=fix(s.eq.armors,3);
    EQUIP.accessories=fix(s.eq.accessories,6);
  }
  // 老存档没有任何装备 → 补发内测初始装备
  if(!EQUIP.weapons.some(Boolean) && !EQUIP.armors.some(Boolean)){
    EQUIP.weapons=['woodsword',null,null];
    EQUIP.armors=['woodhelm','woodchest','woodlegs'];
    try{ ['woodsword','woodhelm','woodchest','woodlegs'].forEach(markSeen); }catch(e){}
  }
  camXs=Math.max(0,Math.min(WORLD_W-VW, p.x-VW/2));
  camYs=Math.max(0,Math.min(WORLD_H-VH, p.y-VH/2));
  camX=Math.round(camXs*RES)/RES; camY=Math.round(camYs*RES)/RES;
  return true;
}
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(collectSigned())); }catch(e){}
  if(typeof saveMsgT!=='undefined') saveMsgT=gtime;
}
function loadGame(){
  try{
    {
      const raw=localStorage.getItem(SAVE_KEY);
      if(raw && raw.indexOf('"h"')>=0){
        const o=JSON.parse(raw);
        const cp=Object.assign({}, o); delete cp.h;
        if(o.h && saveHash(JSON.stringify(cp))!==o.h){
          localStorage.removeItem(SAVE_KEY);
          return false;
        }
      }
    }
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    return applySave(JSON.parse(raw));
  }catch(e){ return false; }
}

function downloadSave(){
  const blob=new Blob([JSON.stringify(collectSave())],{type:'application/json'});

  a.download='星辰回响-存档-'+new Date().toISOString().slice(0,10)+'.star';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function readSaveFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      if(applySave(JSON.parse(r.result))){ saveGame(); alert('存档导入成功'); }
      else alert('这不是有效的「星辰回响」存档');
    }catch(e){ alert('存档文件损坏或格式不对'); }
  };
  r.readAsText(file);
}
const SAVE_SALT='xingchen-echo-2026-m1';
function saveHash(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  let g=0;
  const salted=str+'|'+SAVE_SALT;
  for(let i=0;i<salted.length;i++){ g=(Math.imul(g,31)+salted.charCodeAt(i))>>>0; }
  return h.toString(36)+'.'+g.toString(36);
}
function collectSigned(){
  const o=collectSave();
  o.h=saveHash(JSON.stringify(o));
  return o;
}
function makeSaveCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(collectSigned())))); }
function useSaveCode(code){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(o && o.h){
      const raw=Object.assign({}, o); delete raw.h;
      if(saveHash(JSON.stringify(raw))!==o.h){ alert('存档码校验失败：内容可能被修改过'); return false; }
      delete o.h;
    }
    return applySave(o);
  }
  catch(e){ return false; }
}

function equipLayout(){
  const pad=3, labelH=7, gap=6, swordW=30, swordH=18;
  const WS=22, Wgap=4, weaponW=3*WS+2*Wgap;
  const GW=weaponW+pad*2, GH=labelH+WS+pad*2;
  const AS=12, Agap=3, armorW=3*AS+2*Agap;
  const GA=armorW+pad*2, GAH=labelH+AS+pad*2;
  const SS=10, Sgap=2, accW=3*SS+2*Sgap, accH=2*SS+Sgap;
  const GS=accW+pad*2, GSH=labelH+accH+pad*2;
  const totalW=GA+gap+GW+gap+GS+gap+swordW;
  const x0=Math.round(VW/2-totalW/2), bottom=VH-5;
  const hudBox={x0:x0-4, y0:Math.min(bottom-GAH,bottom-GH,bottom-GSH)-4, x1:x0+totalW+4, y1:bottom+4};
  return {
    pad,labelH,gap,swordW,swordH,WS,AS,SS,GW,GH,GA,GAH,GS,GSH,
    ax:x0, ay:bottom-GAH,
    wx:x0+GA+gap, wy:bottom-GH,
    sx:x0+GA+gap+GW+gap, sy:bottom-GSH,
    swx:x0+GA+gap+GW+gap+GS+gap, swy:bottom-swordH, hudBox
  };
}

function eqGroup(x,y,w,h,label){
  // 外部微光
  octx.fillStyle='rgba(59,130,246,.22)'; octx.fillRect(x-2,y-2,w+4,h+4);
  // 深蓝描边
  octx.fillStyle='#0b2545'; octx.fillRect(x-1,y-1,w+2,h+2);
  // 渐变底（上浅下深，用横向条带模拟）
  for(let i=0;i<h;i++){

    const r=Math.round(37+(28-37)*t), g=Math.round(64+(50-64)*t), b=Math.round(110+(84-110)*t);

  octx.fillStyle='#93c5fd'; octx.fillRect(x,y,w,1);
  octx.fillStyle='rgba(147,197,253,.45)'; octx.fillRect(x,y+1,w,1);

const itemImgs={};
function itemImg(k){
  if(!ITEM_ICONS[k]) return null;
  if(!itemImgs[k]){
    const im=new Image();
    im.onload=()=>{ try{
      if(!document.getElementById('bagWrap').classList.contains('hidden')) renderBag();
      if(!document.getElementById('equipWrap').classList.contains('hidden')) renderEquipPanel();
    }catch(e){} };
    im.src=ITEM_ICONS[k];
    itemImgs[k]=im;
  }
  return itemImgs[k];

function addItem(id,n){

  n=n||1;
  const st=bagItems.find(e=>e.id===id);
  if(st) st.n+=n; else bagItems.push({id,n});
  try{ markSeen(id); }catch(e){}

function removeItem(id,n){
  n=n||1;
  const st=bagItems.find(e=>e.id===id);

  if(st.n<=n) bagItems=bagItems.filter(e=>e!==st);

    const idx=ARMOR_SLOTS.indexOf(it.slot);
    if(idx<0){ toastMsg('该防具没有可用的装备位'); return false; }
    const cur=EQUIP.armors[idx];

function bindItemSlot(el, onTap, onLong){
  let timer=null, longFired=false, sx0=0, sy0=0;
  const pt=(e)=> e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0]) || e;
  const start=(e)=>{
    if(e.target && e.target.closest && e.target.closest('.del-btn')) return;
    if(e.cancelable) e.preventDefault();
    longFired=false;
    const t=pt(e); sx0=t.clientX||0; sy0=t.clientY||0;
    if(timer) clearTimeout(timer);
    timer=setTimeout(()=>{ timer=null; longFired=true; onLong(); }, 380);
  };
  const finish=()=>{ if(timer){ clearTimeout(timer); timer=null; if(!longFired){ sfxBeep(); vibrate(2); onTap(); } } };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  const move=(e)=>{ const t=pt(e); if(Math.hypot((t.clientX||0)-sx0,(t.clientY||0)-sy0)>14) cancel(); };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', finish);
  el.addEventListener('touchmove', move);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', finish);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseleave', cancel);
}

  if(EQUIP.weapons.includes(id)||EQUIP.armors.includes(id)||EQUIP.accessories.includes(id)) return true;
  return bagItems.some(e=>e.id===id);
}
function renderCollection(){
  const g=document.getElementById('colGrid'); if(!g) return;
  g.innerHTML='';
  const list = ((COLLECTION[colTab] && COLLECTION[colTab][colSub]) || []).filter(e=>e && (e.id||e.mob));
  document.getElementById('colTitle').textContent = colTab==='mob' ? '生物图鉴' : (colTab==='equip' ? '装备图鉴' : '物品图鉴');
  for(const e of list){
    const d=document.createElement('div'); d.className='col-slot';
    const unlocked = e.mob ? seenMobs.has(e.mob) : (e.id ? itemUnlocked(e.id) : false);
    if(e.mob && unlocked){
      const d2=document.createElement('div'); d2.className='col-slot';
      const cv=document.createElement('img');
      cv.src=SLIME_ART; cv.style.cssText='width:34px;height:34px;image-rendering:pixelated;';

      const nm=document.createElement('span'); nm.className='cname'; nm.textContent=MOBS[e.mob].n;

      bindItemSlot(d2, ()=>openMobDetail(e.mob, d2), ()=>openMobDetail(e.mob, d2));
      g.appendChild(d2);

    }
    if(e.mob && !unlocked){
      d.classList.add('lock');
      const q=document.createElement('span'); q.className='qmark'; q.textContent='?'; d.appendChild(q);
      g.appendChild(d);

        ()=>openItemDetail(e.id, d, true),

      );
    } else {
      d.classList.add('lock');
      const q=document.createElement('span'); q.className='qmark'; q.textContent='?'; d.appendChild(q);
    }
    g.appendChild(d);
  }

let colScroller=null;
let cbBound2=false;
function colViewEl(){ return document.getElementById('colView'); }
function colMaxScroll(){ const v=colViewEl(); return v?Math.max(0, v.scrollHeight-v.clientHeight):0; }
function updateColScroll(){
  const v=colViewEl();
  const track=document.getElementById('colTrack');
  const thumb=document.getElementById('colThumb');
  if(!v||!track||!thumb) return;
  const vh=v.clientHeight||0, sh=v.scrollHeight||0;
  const max=sh-vh;
  if(max<=2){ track.style.display='none'; return; }
  track.style.display='block';
  const th=track.clientHeight;
  if(!th) return;
  const thH=Math.max(16, Math.min(th-8, Math.round(th*vh/sh)));
  const travel=Math.max(1, th-thH-3);
  thumb.style.height=thH+'px';
  thumb.style.top=Math.max(0,Math.min(travel,Math.round(travel*(v.scrollTop/max))))+'px';
}
function colSet(y){
  const v=colViewEl(); if(!v) return;
  v.scrollTop=Math.max(0, Math.min(colMaxScroll(), y));
  updateColScroll();
}
function bindColScroll(){
  if(cbBound2) return;
  cbBound2=true;
  const v=colViewEl();
  const thumb=document.getElementById('colThumb');
  const track=document.getElementById('colTrack');
  if(!v||!thumb||!track) return;
  let dv=null, dt=null;
  v.addEventListener('scroll', updateColScroll, {passive:true});
  v.addEventListener('touchstart', (e)=>{ dv={y:e.touches[0].clientY, s:v.scrollTop}; }, {passive:true});
  v.addEventListener('touchmove', (e)=>{
    if(!dv) return;
    const dy=e.touches[0].clientY-dv.y;
    if(Math.abs(dy)>2){ colSet(dv.s-dy); if(e.cancelable) e.preventDefault(); }
  }, {passive:false});
  v.addEventListener('touchend', ()=>{ dv=null; });
  thumb.addEventListener('touchstart', (e)=>{
    e.stopPropagation(); dv=null;
    const th=track.clientHeight||1, mx=colMaxScroll();
    dt={y:e.touches[0].clientY, s:v.scrollTop, k:mx/Math.max(1,th-thumb.offsetHeight)};
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  thumb.addEventListener('touchmove', (e)=>{
    if(!dt) return; e.stopPropagation();
    colSet(dt.s+(e.touches[0].clientY-dt.y)*dt.k);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  thumb.addEventListener('touchend', ()=>{ dt=null; });
  track.addEventListener('touchstart', (e)=>{
    e.stopPropagation(); dv=null;
    const r=track.getBoundingClientRect();
    const th=track.clientHeight||1, mx=colMaxScroll();
    const thH=thumb.offsetHeight||24, travel=Math.max(1,th-thH);
    const rel=Math.max(0,Math.min(travel, e.touches[0].clientY-r.top-thH/2));
    colSet(rel/travel*mx);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
}
function makeScroller(viewId, trackId, thumbId){
  const v=document.getElementById(viewId), tr=document.getElementById(trackId), th=document.getElementById(thumbId);
  if(!v||!tr||!th) return null;
  const upd=()=>{
    const vh=v.clientHeight, sh=v.scrollHeight, mx=sh-vh;
    if(mx<=2){ tr.style.display='none'; return; }
    tr.style.display='block';
    const t=tr.clientHeight;
    if(!t) return;
    const h=Math.max(16, Math.min(t-8, Math.round(t*vh/sh)));
    const travel=Math.max(1, t-h-3);
    th.style.height=h+'px';
    th.style.top=Math.max(0,Math.min(travel,Math.round(travel*(v.scrollTop/mx))))+'px';
  };
  const set=(y)=>{ const mx=Math.max(0, v.scrollHeight-v.clientHeight); v.scrollTop=Math.max(0,Math.min(mx,y)); upd(); };
  v.addEventListener('scroll', upd, {passive:true});
  let dv=null, dt=null;
  v.addEventListener('touchstart',(e)=>{ dv={y:e.touches[0].clientY, s:v.scrollTop}; },{passive:true});
  v.addEventListener('touchmove',(e)=>{ if(!dv) return; const dy=e.touches[0].clientY-dv.y; if(Math.abs(dy)>2){ set(dv.s-dy); if(e.cancelable) e.preventDefault(); } },{passive:false});
  v.addEventListener('touchend',()=>{dv=null;});
  v.addEventListener('touchcancel',()=>{dv=null;});
  th.addEventListener('touchstart',(e)=>{ e.stopPropagation(); dv=null;
    const t=tr.clientHeight||1, mx=Math.max(0,v.scrollHeight-v.clientHeight);
    dt={y:e.touches[0].clientY, s:v.scrollTop, k:mx/Math.max(1,t-th.offsetHeight)};
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  th.addEventListener('touchmove',(e)=>{ if(!dt) return; e.stopPropagation();
    set(dt.s+(e.touches[0].clientY-dt.y)*dt.k);
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  th.addEventListener('touchend',()=>{dt=null;});
  th.addEventListener('touchcancel',()=>{dt=null;});
  tr.addEventListener('touchstart',(e)=>{
    e.stopPropagation(); dv=null;
    const r=tr.getBoundingClientRect();
    const t=tr.clientHeight||1, mx=Math.max(0,v.scrollHeight-v.clientHeight);
    const th2=th.offsetHeight||24, travel=Math.max(1,t-th2);
    const rel=Math.max(0,Math.min(travel, e.touches[0].clientY-r.top-th2/2));
    set(rel/travel*mx);
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  return {upd,set};
}
function setBonusInfo(){
  let armor=0;
  for(const id of EQUIP.armors){ if(id && ITEMS[id]) armor += (ITEMS[id].armor||0); }
  let bonus=0;
  const setIds=Object.keys(SETS);
  for(const sk of setIds){
    const st=SETS[sk];
    const partIds=Object.keys(ITEMS).filter(k=>ITEMS[k].set===sk && ITEMS[k].t==='armor');
    const worn=partIds.filter(k=>EQUIP.armors.includes(k)).length;
    if(worn>=st.parts) bonus+=st.bonus;
  }
  return {armor, bonus, total:armor+bonus};
}

let portImg=null;
function drawCharPortrait(){
  const cv=document.getElementById('charPortrait');
  if(!cv) return;
  if(document.getElementById('charWrap').classList.contains('hidden')) return;
  const g=cv.getContext('2d');
  if(!g) return;
  if(!portImg){
    portImg=new Image();
    portImg.src=(typeof PORTRAIT!=='undefined' && PORTRAIT.hero) ? PORTRAIT.hero : '';
  }
  g.clearRect(0,0,128,128);
  g.fillStyle='#0b1626'; g.fillRect(0,0,128,128);
  if(portImg && portImg.complete && portImg.naturalWidth>0){
    const t=performance.now()/1000;
    const bob=Math.round(Math.sin(t*1.1)*1.0);
    g.imageSmoothingEnabled=false;
    g.save();
    g.translate(64,64+bob);
    g.drawImage(portImg,-64,-64,128,128);
    g.restore();

  }
}

function fitCollection(){
  const box=document.querySelector('#colWrap .modal-box');
  const view=document.getElementById('colView');
  if(!box||!view) return;
  box.style.maxHeight='none';
  view.style.maxHeight='none';
  view.style.height='auto';
  void box.offsetHeight;
  const avail=Math.round(viewSize().H*0.86);
  const chrome=Math.max(0, box.offsetHeight - view.offsetHeight);
  const h=Math.max(96, avail - chrome - 4);
  view.style.height=h+'px';
  view.style.maxHeight=h+'px';
  box.style.maxHeight=(h + chrome + 2)+'px';
  updateColScroll();
}

  g.innerHTML='';

function buildColSubs(){

function statFetch(path, cb){
  const done=(v)=>{ try{ if(typeof cb==='function') cb(v); }catch(e){} };
  try{
    const ctl=new AbortController();
    const t=setTimeout(()=>{ try{ctl.abort();}catch(e){} }, 5000);
    fetch('https://abacus.jasoncameron.dev/'+path, {signal:ctl.signal})
      .then(r=>r.json()).then(d=>{ clearTimeout(t); done(d&&d.value); })
      .catch(()=>{ clearTimeout(t); done(null); });

}

let bagDragV=null, bagDragT=null;
function bagViewEl(){ return document.getElementById('bagView'); }
function bagMaxScroll(){
  const v=bagViewEl(); if(!v) return 0;
  return Math.max(0, v.scrollHeight - v.clientHeight);
}
function updateBagScroll(){
  const v=bagViewEl();
  const track=document.getElementById('bagTrack');
  const thumb=document.getElementById('bagThumb');
  if(!v||!track||!thumb) return;
  const vh=v.clientHeight||0, sh=v.scrollHeight||0;
  const max=sh-vh;
  if(max<=2){ track.style.display='none'; return; }
  track.style.display='block';
  const th=track.clientHeight||vh;
  const thH=Math.max(16, Math.min(th-8, Math.round(th*vh/sh)));
  const travel=Math.max(1, th-thH-3);
  thumb.style.height=thH+'px';
  thumb.style.top=Math.max(0, Math.min(travel, Math.round(travel*(v.scrollTop/max))))+'px';
}
function bagSet(y){
  const v=bagViewEl(); if(!v) return;
  const max=bagMaxScroll();
  v.scrollTop=Math.max(0, Math.min(max, y));
  updateBagScroll();
}
let sbBound=false;
function bindScrollbar(){
  if(sbBound) return;
  sbBound=true;
  const v=bagViewEl();
  const thumb=document.getElementById('bagThumb');
  const track=document.getElementById('bagTrack');
  if(!v||!thumb||!track) return;
  v.addEventListener('scroll', updateBagScroll, {passive:true});
  v.addEventListener('touchstart', (e)=>{ bagDragV={ y:e.touches[0].clientY, start:v.scrollTop }; }, {passive:true});
  v.addEventListener('touchmove', (e)=>{
    if(bagDragT || !bagDragV) return;
    const dy=e.touches[0].clientY-bagDragV.y;
    if(Math.abs(dy)>2){ bagSet(bagDragV.start - dy); if(e.cancelable) e.preventDefault(); }
  }, {passive:false});
  v.addEventListener('touchend', ()=>{ bagDragV=null; });
  v.addEventListener('touchcancel', ()=>{ bagDragV=null; });
  thumb.addEventListener('touchstart', (e)=>{
    e.stopPropagation();
    bagDragV=null;
    const th=track.clientHeight||v.clientHeight||1, max=bagMaxScroll(), thH=thumb.offsetHeight||24;
    bagDragT={ y:e.touches[0].clientY, start:v.scrollTop, k:max/Math.max(1, th-thH) };
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  thumb.addEventListener('touchmove', (e)=>{
    if(!bagDragT) return;
    e.stopPropagation();
    bagSet(bagDragT.start + (e.touches[0].clientY-bagDragT.y)*bagDragT.k);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  thumb.addEventListener('touchend', (e)=>{ e.stopPropagation(); bagDragT=null; });
  thumb.addEventListener('touchcancel', ()=>{ bagDragT=null; });
  thumb.addEventListener('mousedown', (e)=>{
    e.stopPropagation();
    bagDragV=null;
    const th=track.clientHeight||v.clientHeight||1, max=bagMaxScroll(), thH=thumb.offsetHeight||24;
    bagDragT={ y:e.clientY, start:v.scrollTop, k:max/Math.max(1, th-thH) };
    e.preventDefault();
  });
  addEventListener('mousemove', (e)=>{ if(bagDragT) bagSet(bagDragT.start + (e.clientY-bagDragT.y)*bagDragT.k); });
  addEventListener('mouseup', ()=>{ bagDragT=null; });
  track.addEventListener('touchstart', (e)=>{
    e.stopPropagation(); bagDragV=null;
    const r=track.getBoundingClientRect();
    const th=track.clientHeight||v.clientHeight||1, max=bagMaxScroll(), thH=thumb.offsetHeight||24;
    const travel=Math.max(1, th-thH);
    const rel=Math.max(0, Math.min(travel, e.touches[0].clientY-r.top-thH/2));
    bagSet(rel/travel*max);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
}

function drawAmbient(){
  const gx0=Math.max(0,Math.floor(camX/TILE)), gx1=Math.min(WCOLS,Math.ceil((camX+VW)/TILE));
  const gy0=Math.max(0,Math.floor(camY/TILE)), gy1=Math.min(WROWS,Math.ceil((camY+VH)/TILE));
  for(let ty=gy0; ty<gy1; ty++) for(let tx=gx0; tx<gx1; tx++){
    if(world[ty][tx]===0 && tileWaterCnt[ty*WCOLS+tx]>20){
      const wx0=tx*TILE, wy0=ty*TILE;
      if(wx0+TILE>BRIDGE.x && wx0<BRIDGE.x+BRIDGE.w && wy0+TILE>BRIDGE.y && wy0<BRIDGE.y+BRIDGE.h) continue;
      const sx=tx*TILE-camX, sy=ty*TILE-camY;
      const ph=Math.sin(gtime*2+tx*0.7+ty*1.3);
      px(sx+3+ph*3, sy+5, 3,1,'#4a8fd4');
      px(sx+9-ph*2, sy+11, 2,1,'#5fa8e6');
    }
  }
  for(let i=0;i<14;i++){
    const fx=hash(i,7)*WORLD_W + Math.sin(gtime*0.15+i)*30;
    const fy=hash(i,13)*WORLD_H + Math.cos(gtime*0.12+i*1.7)*24;
    const x=fx-camX, y=fy-camY;
    if(x>-4&&x<VW+4&&y>-4&&y<VH+4){
      octx.globalAlpha=0.35+0.45*Math.abs(Math.sin(gtime*1.5+i));
      px(x,y,1,1,'#fde68a');

    }

}
let toastTimer=null, interactTarget=null;
function facingTarget(tx,ty){
  const dx=tx-player.x;
  if(player.face>=0) return dx>-6;
  return dx<6;
}
const PROP_TEXT={
  well:'井水很凉，深不见底。',
  lamp:'普通的路灯。',
  fence:'我似乎无法翻越它们。',
  flower:'这些花真美。',
  crate:'似乎是空心的。'
};
function updateInteract(){
  let best=null, bd=1e9;
  const consider=(k, x, y, extra, prio)=>{
    const dist=Math.hypot(player.x-x, player.y-y);
    if(dist>28 || !facingTarget(x,y)) return;
    const score=dist - prio;
    if(score<bd){ bd=score; best=Object.assign({k, x, y, dist}, extra||{}); }
  };
  // 掉落物最优先
  for(const d of drops){
    const dist=Math.hypot(player.x-d.x, player.y-d.y);
    if(dist<22 && facingTarget(d.x,d.y) && dist<bd){ bd=dist; best={k:'drop', d}; }
  }
  if(!best){
    consider('npc', NPC.x, NPC.y, {npc:'erin'}, 0);
    consider('npc', ELDER.x, ELDER.y, {npc:'elder'}, 0);
    consider('npc', OFFICER.x, OFFICER.y, {npc:'officer'}, 0);
    if(!best){
      const dd=Math.hypot(player.x-SHOP_DOOR.x, player.y-SHOP_DOOR.y);
      if(dd<14 && facingTarget(SHOP_DOOR.x, SHOP_DOOR.y)) best={k:'door', dist:dd};
    }
    // 摆件互动（路灯/栅栏/花坛/木箱/水井）
    if(!best){
      for(const pr of PROPS){
        if(!PROP_TEXT[pr.type]) continue;
        const cx=pr.x + (pr.type==='fence' ? (pr.n||5)*3 : 0);
        const cy=pr.y - (pr.type==='lamp'?18:6);
        const dd=Math.hypot(player.x-cx, player.y-cy);
        if(dd<20 && facingTarget(cx,cy) && dd<bd){ bd=dd; best={k:'prop', p:pr, dist:dd}; }
      }
    }
    // 训练假人
    if(!best){
      const dd=Math.hypot(player.x-DUMMY.x, player.y-DUMMY.y);
      if(dd<24 && facingTarget(DUMMY.x,DUMMY.y)) best={k:'dummy', dist:dd};
    }
  }
  interactTarget=best;
  nearNpc=!!best;
  updateHudButtons();
}

  const el=document.getElementById('msgToast'); if(!el) return;

  if(talking || !interactTarget) return;
  const t=interactTarget;
  if(t.k==='drop'){ pickupDrop(t.d); return; }
  if(t.k==='door'){ sfxBeep(); toastMsg('商店'); setTimeout(()=>{ enterShop(); }, 260); return; }
  if(t.k==='prop'){ sfxBeep(); toastMsg(PROP_TEXT[t.p.type]||'……'); return; }
  if(t.k==='dummy'){ sfxBeep(); toastMsg('这东西会不会活过来。'); return; }
  if(t.k==='exitDoor'){ sfxBeep(); exitShop(); return; }
  if(t.k==='counter'){ sfxBeep(); openShop(); return; }
  if(t.k==='npc'){
    if(t.npc==='erin'){
      if(storyTalked){ sfxBeep(); openDialogue('erinAgain'); return; }
      sfxBeep(); openDialogue('start'); return;

    if(t.npc==='elder'){

  }
};

function showNode(key){
  const n=DLG_DATA[key];
  if(!n){ closeDialogue(); return; }
  dlgNode=n;
  document.getElementById('dlgName').textContent=n.name;
  const pimg = PORTRAIT[n.who] || PORTRAIT.npc;
  document.getElementById('dlgPortrait').src = pimg;
  const txt=document.getElementById('dlgText');
  const ch=document.getElementById('dlgChoices');
  ch.innerHTML=''; txt.textContent='';
  dlgFull=n.text; dlgPos=0; dlgDone=false;
  clearInterval(dlgTimer);
  dlgTimer=setInterval(()=>{
    dlgPos++;
    txt.textContent=dlgFull.slice(0,dlgPos);
    if(dlgPos%2===0) sfxTick();
    if(dlgPos>=dlgFull.length){
      clearInterval(dlgTimer);
      dlgDone=true;
      if(n.give && !dlgGiven[n.give]){
        dlgGiven[n.give]=true; spawnDrop(n.give);
        addItem('wood',20); toastMsg('获得 木头 ×20');
      }
      showChoices(n);
    }
  }, 40);
}
function showChoices(n){
  const box=document.getElementById('dlgChoices');
  box.innerHTML='';
  if(n.choices){
    for(const c of n.choices){
      const b=document.createElement('button');
      b.textContent=c.label;
      b.onclick=()=>{ sfxBeep(); vibrate(2); showNode(c.next); };
      box.appendChild(b);
    }
  } else {
    const b=document.createElement('button');
    b.textContent=n.next ? '继续 ▸' : '结束';
    b.onclick=()=>{ sfxBeep(); vibrate(2); n.next ? showNode(n.next) : closeDialogue(); };
    box.appendChild(b);
  }
}

function sfxXp(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  [[880,0],[1180,0.06]].forEach(([f,d])=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,t+d);
    g.gain.setValueAtTime(0.0001,t+d);
    g.gain.linearRampToValueAtTime(0.09,t+d+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.12);
    o.connect(g); g.connect(sfxGain); o.start(t+d); o.stop(t+d+0.14);
  });
}
function sfxCoin(){
  if(!actx||!sfxOn||mutedAll) return;

  });
}
function sfxHurt(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(60,t+0.18);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.13,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.24);
}
function sfxCrit(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  [880,1320].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(f,t+i*0.05);
    g.gain.setValueAtTime(0.0001,t+i*0.05);
    g.gain.linearRampToValueAtTime(0.07,t+i*0.05+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.05+0.14);
    o.connect(g); g.connect(sfxGain); o.start(t+i*0.05); o.stop(t+i*0.05+0.16);
  });
}
function sfxSwing(){
  if(!actx||!sfxOn||mutedAll||!noiseBuf) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const bp=actx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(2400,t);
  bp.frequency.exponentialRampToValueAtTime(480,t+0.2);
  bp.Q.value=1.1;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.26,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  src.connect(bp); bp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t+0.24);
}

// 击退公式：攻击方击退值 vs 被击退方重量，收益递减，不会夸张
function knockbackForce(kb, weight){
  const k=Math.max(0, kb||0), w=Math.max(1, weight||1);
  return Math.min(180, 80*k/(k+w));
}
function hitSlime(s, dmg, crit, kb){
  if(!s || s.iframe>0) return;
  s.iframe=0.4; s.hitFlash=0.2;
  s.hp-=dmg;
  addDmgNum(s.x, s.y-18, dmg, crit);
  spawnHitSpark(s.x, s.y-8);
  const dx=s.x-player.x, dy=s.y-player.y, d=Math.hypot(dx,dy)||1;
  const force=knockbackForce(kb!=null?kb:1, 1);
  s.vx=dx/d*force; s.vy=dy/d*force;
  if(s.hp<=0) killSlime(s);
}
function killSlime(s){
  slimes=slimes.filter(x=>x!==s);
  // 经验球 + 铜币（爆发）
  for(let i=0;i<2;i++) orbs.push({kind:'xp', x:s.x, y:s.y-6, vx:(Math.random()*2-1)*70, vy:-Math.random()*70-30, life:60, val:4});

  for(let i=0;i<5;i++){
    const a=Math.random()*Math.PI*2;
    chunks.push({x:s.x, y:s.y-8, vx:Math.cos(a)*70, vy:-Math.random()*80-20,
                 life:3+Math.random()*2, size:2+Math.floor(Math.random()*2),
                 col:['#7ed957','#5cc23a','#9df07a'][i%3]});
  }
  // 粘液飞溅（落地消失）
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    splats.push({x:s.x, y:s.y-8, vx:Math.cos(a)*60, vy:-Math.random()*60-20, life:1.2, dead:false});
  }
  sfxHit();
}

function updateSlime(dt){
  updateFlow();
  if(playerIframe>0) playerIframe=Math.max(0,playerIframe-dt);
  if(playerHurt>0) playerHurt=Math.max(0,playerHurt-dt);
  if(dead){
    deathT+=dt;
    if(deathT>=3 && !reviveReady){
      reviveReady=true;
      try{
        const b=document.getElementById('reviveBtn');
        b.classList.remove('hidden');
        b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      }catch(e){}
    }
    return;
  }
  for(const s of slimes){
    // 自愈：万一卡在障碍里，挤到最近的可走位置
    if(solidAt(s.x,s.y)){
      let freed=false;
      for(let r=8; r<=56 && !freed; r+=8){
        for(const [ox,oy] of [[0,-r],[0,r],[-r,0],[r,0],[-r,-r],[r,-r],[-r,r],[r,r]]){
          if(!solidAt(s.x+ox, s.y+oy)){ s.x+=ox; s.y+=oy; freed=true; break; }
        }
      }
    }
    if(s.iframe>0) s.iframe=Math.max(0,s.iframe-dt);
    if(s.hitFlash>0) s.hitFlash=Math.max(0,s.hitFlash-dt);
    if(s.atkAnim>0) s.atkAnim=Math.max(0,s.atkAnim-dt);
    s.wob+=dt*7;
    const dx=player.x-s.x, dy=player.y-s.y;
    const dist=Math.hypot(dx,dy)||1;
    s.face = dx>=0?1:-1;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    s.vx*=Math.pow(0.001,dt); s.vy*=Math.pow(0.001,dt);
    const speed=52;
    if(dist>14){
      const dxn=dx/dist, dyn=dy/dist;
      const step=speed*dt;
      const clear=lineClear(s.x, s.y, player.x, player.y);
      let vx=dxn, vy=dyn;
      if(!clear){
        const nxt=flowStep(s);
        if(nxt){
          const ndx=nxt.x-s.x, ndy=nxt.y-s.y;
          const nd=Math.hypot(ndx,ndy)||1;
          vx=ndx/nd; vy=ndy/nd;
        }
      }
      const nx=s.x+vx*step, ny=s.y+vy*step;
      if(!solidAt(nx,ny)){ s.x=nx; s.y=ny; s.stuck=0; }
      else {
        const ax=s.x+dxn*step, ay=s.y+dyn*step;
        if(!solidAt(ax,ay)){ s.x=ax; s.y=ay; }
        else if(!solidAt(s.x+vx*step, s.y)) s.x+=vx*step;
        else if(!solidAt(s.x, s.y+vy*step)) s.y+=vy*step;
        else { s.stuck+=dt; if(s.stuck>0.3){ s.side=-s.side; s.stuck=0; } }
      }
    }
    if(s.atkCd>0) s.atkCd=Math.max(0,s.atkCd-dt);
    if(dist<16 && s.atkCd<=0){
      s.atkCd=1.2; s.atkAnim=0.22;
      if(playerIframe<=0 && player.hp>0 && !godMode){
        player.hp=Math.max(0,player.hp-s.dmg);
        {
          const f=knockbackForce(s.dmg*0.5, PLAYER_WEIGHT);
          const kdx=player.x-s.x, kdy=player.y-s.y, kd=Math.hypot(kdx,kdy)||1;
          pvx=kdx/kd*f; pvy=kdy/kd*f;
        }
        playerIframe=0.4; playerHurt=0.32;
        addDmgNum(player.x, player.y-20, s.dmg, false);
        vibrate(3); sfxHurt();
        if(player.hp<=0) killPlayer();
        else saveGame();
      }
    }
  }
  separateSlimes();
}
// ---------- 流场寻路（一次 BFS 供所有怪物使用） ----------
let flowDist=null, flowTile=-1, flowT=0;
function tilePassable(tx,ty){
  if(tx<1||ty<1||tx>=WCOLS-1||ty>=WROWS-1) return false;
  return !solidAt(tx*TILE+TILE/2, ty*TILE+TILE/2);
}
function computeFlow(px,py){
  const W=WCOLS, H=WROWS;
  flowDist=new Int32Array(W*H).fill(-1);
  let sx=Math.floor(px/TILE), sy=Math.floor(py/TILE);
  if(!tilePassable(sx,sy)){
    let found=false;
    for(let r=1;r<=4 && !found;r++){
      for(let dy=-r;dy<=r && !found;dy++) for(let dx=-r;dx<=r && !found;dx++){
        if(tilePassable(sx+dx,sy+dy)){ sx+=dx; sy+=dy; found=true; }
      }
    }
    if(!found) return;
  }
  const start=sy*W+sx;
  flowDist[start]=0;
  const q=new Int32Array(W*H); let head=0, tail=0;
  q[tail++]=start;
  while(head<tail){
    const cur=q[head++];
    const cx=cur%W, cy=(cur-cx)/W;
    const d=flowDist[cur]+1;
    for(let k=0;k<4;k++){
      const nx=cx+(k===0?1:k===1?-1:0), ny=cy+(k===2?1:k===3?-1:0);
      if(nx<1||ny<1||nx>=W-1||ny>=H-1) continue;
      const ni=ny*W+nx;
      if(flowDist[ni]!==-1) continue;
      if(!tilePassable(nx,ny)) continue;
      flowDist[ni]=d; q[tail++]=ni;
    }
  }
}
function flowStep(s){
  if(!flowDist) return null;
  const W=WCOLS;
  const tx=Math.floor(s.x/TILE), ty=Math.floor(s.y/TILE);
  if(tx<0||ty<0||tx>=WCOLS||ty>=WROWS) return null;
  const cur=flowDist[ty*W+tx];
  let best=null, bestD=cur===-1?1e9:cur;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(!dx && !dy) continue;
    const nx=tx+dx, ny=ty+dy;
    if(nx<1||ny<1||nx>=WCOLS||ny>=WROWS) continue;
    if(dx&&dy && (!tilePassable(tx+dx,ty) || !tilePassable(tx,ty+dy))) continue;
    const v=flowDist[ny*W+nx];
    if(v===-1) continue;
    if(v<bestD){ bestD=v; best={x:nx*TILE+TILE/2, y:ny*TILE+TILE/2}; }
  }
  return best;
}
function updateFlow(){
  const tx=Math.floor(player.x/TILE), ty=Math.floor(player.y/TILE);
  const key=ty*WCOLS+tx;
  if(!flowDist || key!==flowTile || gtime-flowT>0.6){
    computeFlow(player.x, player.y);
    flowTile=key; flowT=gtime;
  }
}
function lineClear(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0);
  const n=Math.max(2, Math.round(d/7));
  for(let i=1;i<n;i++){
    const t=i/n;
    if(solidAt(x0+(x1-x0)*t, y0+(y1-y0)*t)) return false;
  }
  return true;
}
function separateSlimes(){
  for(let i=0;i<slimes.length;i++){
    for(let j=i+1;j<slimes.length;j++){
      const a=slimes[i], b=slimes[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.hypot(dx,dy);
      if(d<1e-4) { a.x-=0.6; b.x+=0.6; continue; }
      const min=17;
      if(d<min){
        const push=(min-d)/2, nx=dx/d, ny=dy/d;
        if(!solidAt(a.x-nx*push, a.y-ny*push)){ a.x-=nx*push; a.y-=ny*push; }
        if(!solidAt(b.x+nx*push, b.y+ny*push)){ b.x+=nx*push; b.y+=ny*push; }
      }
    }
  }
  for(const s of slimes){
    const dx=s.x-player.x, dy=s.y-player.y;
    const d=Math.hypot(dx,dy);
    if(d>1e-4 && d<15){
      const nx=dx/d, ny=dy/d, push=(15-d);
      if(!solidAt(s.x+nx*push, s.y+ny*push)){ s.x+=nx*push*0.8; s.y+=ny*push*0.8; }
    }
  }
}
function updateOrbs(dt){
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];
    o.life-=dt;
    const dx=player.x-o.x, dy=player.y-6-o.y, d=Math.hypot(dx,dy)||1;
    if(d<32){ o.vx+=dx/d*420*dt; o.vy+=dy/d*420*dt; }
    o.vx*=Math.pow(0.12,dt); o.vy*=Math.pow(0.12,dt);
    const nx2=o.x+o.vx*dt, ny2=o.y+o.vy*dt;
    if(!solidAt(nx2,o.y)) o.x=nx2; else o.vx*=-0.35;
    if(!solidAt(o.x,ny2)) o.y=ny2; else o.vy*=-0.35;
    // 万一卡进实体，逐步推出来
    if(solidAt(o.x,o.y)){
      let freed=false;
      for(let r=6; r<=48 && !freed; r+=6){
        for(const [ox,oy] of [[0,-r],[0,r],[-r,0],[r,0],[-r,-r],[r,-r],[-r,r],[r,r]]){
          if(!solidAt(o.x+ox,o.y+oy)){ o.x+=ox; o.y+=oy; freed=true; break; }
        }
      }
    }
    if(d<8){
      if(o.kind==='xp'){ gainXp(o.val||4); sfxXp(); }
      else { money+=(o.val||1); sfxCoin(); }
      orbs.splice(i,1);
      continue;
    }
    if(o.life<=0) orbs.splice(i,1);
  }
}
function hpForLevel(lv){
  return Math.round(100*Math.pow(1.05, Math.max(0,lv)));
}
function gainXp(n){
  xp+=n;
  while(xp>=xpNeed){
    xp-=xpNeed; level++; xpNeed=nextXpNeed(xpNeed);
    const oldMax=player.maxHp, oldMp=player.maxMp||30;
    player.maxHp=Math.max(1, Math.round(player.maxHp*1.05));
    player.hp=Math.min(player.maxHp, player.hp+(player.maxHp-oldMax));
    player.maxMp=Math.max(1, Math.round(oldMp*1.05));
    player.mp=Math.min(player.maxMp, (player.mp||0)+(player.maxMp-oldMp));
    toastMsg('升级！Lv '+level+'　生命 +'+(player.maxHp-oldMax)+'　法力 +'+(player.maxMp-oldMp));
    sfxEquip(); vibrate(3);
  }
}
function updateCombatFx(dt){
  for(let i=chunks.length-1;i>=0;i--){
    const c=chunks[i];
    c.life-=dt;
    c.vy+=260*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=Math.pow(0.4,dt);
    if(c.life<=0) chunks.splice(i,1);
  }
  for(let i=splats.length-1;i>=0;i--){
    const p2=splats[i];
    p2.life-=dt;
    if(!p2.dead){
      p2.vy+=300*dt; p2.x+=p2.vx*dt; p2.y+=p2.vy*dt;
      if(p2.y>=p2.groundY){} // 占位
      if(p2.life<=0.6){ p2.dead=true; p2.deadT=0.5; }
    } else {
      p2.deadT-=dt;
      if(p2.deadT<=0) splats.splice(i,1);
    }
  }
  if(splats.length>60) splats.splice(0, splats.length-60);
}

function roomSolid(x,y){
  if(x<18||y<22||x>ROOM.w-18||y>ROOM.h-14) return true;
  if(y>30 && y<52 && x>22 && x<ROOM.w-22) return true;
  return false;
}

       document.getElementById('craftWrap').classList.add('hidden');

       closeChar(); }catch(e){}

function exitShop(){

  inShop=false;
  if(townPos){ player.x=townPos.x; player.y=townPos.y+12; }

function updateShop(dt){
  if(!(player.x>18 && player.x<ROOM.w-18)) player.x=ROOM.w/2;
  if(!(player.y>22 && player.y<ROOM.h-14)) player.y=ROOM.h-24;
  let mvx=0, mvy=0;
  if(!talking){
    if(joy.active && Math.hypot(joy.dx,joy.dy)>2){ mvx=joy.dx; mvy=joy.dy; }
    else {
      if(keys['a']||keys['arrowleft']) mvx-=1;
      if(keys['d']||keys['arrowright']) mvx+=1;
      if(keys['w']||keys['arrowup']) mvy-=1;
      if(keys['s']||keys['arrowdown']) mvy+=1;
    }
  }
  const mag=Math.hypot(mvx,mvy);
  if(mag>0){
    const nx=player.x+mvx/mag*player.speed*dt, ny=player.y+mvy/mag*player.speed*dt;
    if(!roomSolid(nx,player.y)) player.x=Math.max(18,Math.min(ROOM.w-18,nx));
    if(!roomSolid(player.x,ny)) player.y=Math.max(22,Math.min(ROOM.h-14,ny));
    walkPhase+=dt*16;
    const si=Math.floor(walkPhase/Math.PI);
    if(si!==lastStep){ lastStep=si; playStep(); if(si%2===0) vibrate(1); }
    if(mvx>0) player.face=1; else if(mvx<0) player.face=-1;
  } else { walkPhase=0; lastStep=-1; }
  if(attacking>0) attacking=Math.max(0,attacking-dt);
  if(atkCd>0) atkCd=Math.max(0,atkCd-dt);
  if(player.maxMp) player.mp=Math.min(player.maxMp,(player.mp||0)+dt*0.25);
  centerRoomCam();
  let best=null;
  if(Math.hypot(player.x-ROOM.w/2, player.y-58)<34) best={k:'counter'};
  else if(player.y>ROOM.h-30) best={k:'exitDoor'};
  interactTarget=best; nearNpc=!!best;
  updateHudButtons();
}
let shopBound=false;
function shopMaxScroll(){

  return v? Math.max(0, v.scrollHeight-v.clientHeight) : 0;
}
function shopScrollUpdate(){
  const v=document.getElementById('shopView'), track=document.getElementById('shopTrack'), thumb=document.getElementById('shopThumb');
  if(!v||!track||!thumb) return;
  const vh=v.clientHeight, sh=v.scrollHeight, max=sh-vh;
  if(max<=2){ track.style.display='none'; return; }
  track.style.display='block';
  const th=track.clientHeight; if(!th) return;
  const thH=Math.max(18, Math.min(th-8, Math.round(th*vh/sh)));
  const travel=Math.max(1, th-thH-3);
  thumb.style.height=thH+'px';
  thumb.style.top=Math.max(0,Math.min(travel,Math.round(travel*(v.scrollTop/max))))+'px';
}
function shopScrollSet(y){
  const v=document.getElementById('shopView'); if(!v) return;
  v.scrollTop=Math.max(0, Math.min(shopMaxScroll(), y));
  shopScrollUpdate();
}
function bindShopScroll(){
  if(shopBound) return;
  shopBound=true;
  const v=document.getElementById('shopView'), track=document.getElementById('shopTrack'), thumb=document.getElementById('shopThumb');
  if(!v||!track||!thumb) return;
  let dv=null, dt=null;
  v.addEventListener('scroll', shopScrollUpdate, {passive:true});
  v.addEventListener('touchstart',(e)=>{ dv={y:e.touches[0].clientY, s:v.scrollTop}; },{passive:true});
  v.addEventListener('touchmove',(e)=>{ if(!dv) return; const dy=e.touches[0].clientY-dv.y;
    if(Math.abs(dy)>2){ shopScrollSet(dv.s-dy); if(e.cancelable) e.preventDefault(); } },{passive:false});
  v.addEventListener('touchend',()=>{dv=null;});
  thumb.addEventListener('touchstart',(e)=>{ e.stopPropagation(); dv=null;
    const th=track.clientHeight||1, mx=shopMaxScroll();
    dt={y:e.touches[0].clientY, s:v.scrollTop, k:mx/Math.max(1,th-thumb.offsetHeight)};
    if(e.cancelable) e.preventDefault(); },{passive:false});
  thumb.addEventListener('touchmove',(e)=>{ if(!dt) return; e.stopPropagation();
    const dy=e.touches[0].clientY-dt.y;
    shopScrollSet(dt.s+dy*dt.k);
    if(e.cancelable) e.preventDefault(); },{passive:false});
  thumb.addEventListener('touchend',()=>{ dt=null; });
  track.addEventListener('touchstart',(e)=>{ e.stopPropagation(); dv=null;
    const r=track.getBoundingClientRect();
    const rel=(e.touches[0].clientY-r.top)/Math.max(1,r.height);
    shopScrollSet(shopMaxScroll()*rel);
    if(e.cancelable) e.preventDefault(); },{passive:false});
}

const DUMMY={x:726, y:470, flash:0, shake:0};
let dmgNums=[], hitSparks=[];
function addDmgNum(x,y,txt,crit){
  dmgNums.push({x,y,vy:-42,life:0.9,max:0.9,txt:String(txt),crit:!!crit});
  if(dmgNums.length>24) dmgNums.shift();
}
function updateDmgNums(dt){
  for(let i=dmgNums.length-1;i>=0;i--){
    const d=dmgNums[i];
    d.life-=dt; d.y+=d.vy*dt; d.vy+=120*dt;
    if(d.life<=0) dmgNums.splice(i,1);
  }
  for(let i=hitSparks.length-1;i>=0;i--){
    const p2=hitSparks[i];
    p2.life-=dt; p2.x+=p2.vx*dt; p2.y+=p2.vy*dt; p2.vy+=180*dt;
    if(p2.life<=0) hitSparks.splice(i,1);
  }
}
function drawDmgNums(){
  for(const d of dmgNums){
    const a=Math.max(0, Math.min(1, d.life/0.4));
    octx.globalAlpha=a;
    const x=Math.round(d.x-camX), y=Math.round(d.y-camY);
    if(d.crit){
      drawText(d.txt, x-7, y, '#fbbf24', 2);

    } else {
      drawText(d.txt, x-5, y, '#ffffff', 2);
    }
    octx.globalAlpha=1;
  }
  for(const p2 of hitSparks){
    octx.globalAlpha=Math.max(0,p2.life/0.3);

function sfxHit(){
  if(!actx||!sfxOn||mutedAll) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(220,t);
  o.frequency.exponentialRampToValueAtTime(90,t+0.09);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.18,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.14);
}
